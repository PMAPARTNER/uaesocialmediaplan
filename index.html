<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>Grand Tour Dijital Görünürlük</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200;300;400;500;600&display=swap">
<style>
/* Layout: uaegrandtour.com dili — kum zemin, ince büyük harf Jost başlıklar, numaralı bölüm etiketleri, kil rengi hap butonlar */
:root{
  --sand:#f4ede6; --sand-2:#e9dbcc; --paper:#fcfaf7; --ink:#223749; --ink-2:#344d67;
  --clay:#c06642; --clay-dark:#9c4f2f; --gold:#c5954d; --forest:#31463c; --stone:#8a7a68;
  --line:rgba(34,55,73,.14); --muted:rgba(34,55,73,.68);
  --bg:var(--sand); --fg:var(--ink); --surface:var(--paper); --surface-2:var(--sand-2);
  --hero-bg:#223749; --hero-fg:#fcfaf7; --dune-1:#c06642; --dune-2:#9c4f2f; --dune-3:#d8c6af; --sun:#edc48a;
  --ok:#3f7a5a; --warn:#b07a1f; --bad:#a8432a;
  --display:"Jost","Noto Kufi Arabic",system-ui,sans-serif; --body:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16212b; --fg:#efe6dc; --surface:#1e2c39; --surface-2:#263849; --line:rgba(239,230,220,.14); --muted:rgba(239,230,220,.66);
  --ink:#efe6dc; --ink-2:#cdbfae; --clay:#dc8460; --clay-dark:#c06642; --gold:#d9ac66; --forest:#8fb39e; --stone:#b3a38f;
  --hero-bg:#0f1820; --hero-fg:#f4ede6; --dune-1:#a4532f; --dune-2:#7e3d22; --dune-3:#3a4b5a; --sun:#d9ac66;
  --ok:#7cc29a; --warn:#e0b25a; --bad:#e58a6d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16212b; --fg:#efe6dc; --surface:#1e2c39; --surface-2:#263849; --line:rgba(239,230,220,.14); --muted:rgba(239,230,220,.66);
  --ink:#efe6dc; --ink-2:#cdbfae; --clay:#dc8460; --clay-dark:#c06642; --gold:#d9ac66; --forest:#8fb39e; --stone:#b3a38f;
  --hero-bg:#0f1820; --hero-fg:#f4ede6; --dune-1:#a4532f; --dune-2:#7e3d22; --dune-3:#3a4b5a; --sun:#d9ac66;
  --ok:#7cc29a; --warn:#e0b25a; --bad:#e58a6d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-weight:300;font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero-bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--clay)}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;text-wrap:balance;margin:0}
h2{font-weight:200;font-size:clamp(30px,4.6vw,48px);letter-spacing:-.035em;line-height:1.02;color:var(--fg)}
h3{font-weight:300;font-size:19px;letter-spacing:-.01em;line-height:1.2}
p{margin:0}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:11.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--clay)}
.eyebrow::before{content:"";width:34px;height:1px;background:var(--gold)}
.lede{font-size:18px;max-width:64ch;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--clay);color:#fff;border:0;border-radius:999px;padding:11px 20px;font:500 11.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.pill:hover{background:var(--clay-dark)}
.pill.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.pill.ghost:hover{border-color:var(--clay);color:var(--clay)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hero-bg);color:var(--hero-fg);border-bottom:1px solid rgba(255,255,255,.08)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:60px}
.logo{font:300 11px/1.05 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--hero-fg);text-decoration:none}
.logo b{font-weight:500;color:var(--sun)}
.navlinks{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{color:rgba(255,255,255,.72);text-decoration:none;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:8px 10px;border-radius:999px;white-space:nowrap}
.navlinks a:hover{color:#fff;background:rgba(255,255,255,.08)}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-fg);position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:2;padding-block:72px 210px;display:grid;gap:22px}
.hero h1{font-weight:100;font-size:clamp(40px,7.4vw,92px);letter-spacing:-.05em;line-height:.95;color:var(--hero-fg)}
.hero h1 span{color:var(--sun)}
.hero .lede{color:rgba(255,255,255,.8);font-size:18px}
.hero .eyebrow{color:var(--sun)}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.hero-meta .tag{color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.25)}
.dunes{position:absolute;inset:auto 0 0 0;height:260px;z-index:1;width:100%}
.sun{position:absolute;right:18%;bottom:120px;width:104px;height:104px;border-radius:50%;background:var(--sun);opacity:.9;z-index:1}
.dunes .d1{fill:var(--dune-3)} .dunes .d2{fill:var(--dune-1)} .dunes .d3{fill:var(--dune-2)} .dunes .d4{fill:var(--bg)}

section.block{padding-block:84px;border-top:1px solid var(--line)}
section.block:first-of-type{border-top:0}
.head{display:grid;gap:16px;margin-bottom:40px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);padding:24px;display:grid;gap:12px;align-content:start;min-width:0}
.card h3{color:var(--fg)}
.card ul{margin:0;padding-left:18px;display:grid;gap:6px}
.card li::marker{color:var(--gold)}
.num{font:200 44px/1 var(--display);letter-spacing:-.04em;color:var(--clay);font-variant-numeric:tabular-nums}
.kpi .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.flag{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:16px 0;border-top:1px solid var(--line)}
.flag:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:8px}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

/* route strip */
.route{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;border:1px solid var(--line);background:var(--surface)}
.route div{padding:18px 14px;border-left:1px solid var(--line);display:grid;gap:4px;align-content:start}
.route div:first-child{border-left:0}
.route b{font:400 13px/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase}
.route i{font-style:normal;font-size:13px;color:var(--clay)}
.route span{font-size:12px;color:var(--muted)}
@media (max-width:860px){.route{grid-template-columns:1fr 1fr}.route div{border-left:0;border-top:1px solid var(--line)}}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.matrix td{font-size:12.5px;min-width:120px}

/* platform pills */
.pl{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.08em;padding:3px 7px;border-radius:4px;color:#fff;min-width:30px;text-align:center}
.pl.IG{background:#b0465f}.pl.TT{background:#1f2a33}.pl.YT{background:#b8322a}.pl.FB{background:#3a5a98}.pl.LI{background:#2b6a96}.pl.PN{background:#a33a3a}.pl.EM{background:var(--forest)}.pl.GB{background:#6a7d3a}.pl.WA{background:#2f7d5c}
:root[data-theme="dark"] .pl.TT{background:#4a5763}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pl.TT{background:#4a5763}}

/* calendar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--fg);font:500 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink-2);color:var(--paper)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--clay);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--clay);color:#fff}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 10px;font:500 11px/1 var(--body);letter-spacing:.06em;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="false"]{opacity:.45}
.cal{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.day{background:var(--surface);border:1px solid var(--line);display:grid;align-content:start;min-width:0}
.day.special{border-color:var(--gold)}
.day header{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.day .dt{font:300 20px/1 var(--display);text-transform:uppercase;letter-spacing:-.01em}
.day .dt small{font-size:11px;letter-spacing:.16em;color:var(--muted);margin-left:6px}
.day .wk{font-size:11px;color:var(--clay);letter-spacing:.08em;text-transform:uppercase}
.badge{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:#1c1c1c;padding:3px 8px;border-radius:999px}
.item{display:grid;grid-template-columns:44px 40px 1fr;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:13.5px;align-items:start}
.item:first-of-type{border-top:0}
.item .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;padding-top:1px}
.item .ti{min-width:0}
.item .meta{font-size:11px;color:var(--muted);letter-spacing:.03em;margin-top:2px;word-break:break-all}
.note{padding:10px 16px;font-size:12.5px;background:var(--surface-2);color:var(--muted)}
.summary{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);margin-bottom:14px}
.summary b{color:var(--fg);font-weight:500}
select{font:400 14px var(--body);padding:9px 12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;max-width:100%}

/* funnel */
.funnel{display:grid;gap:8px}
.funnel div{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:16px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);align-items:center}
.funnel div:nth-child(1){margin-inline:0} .funnel div:nth-child(2){margin-inline:3%} .funnel div:nth-child(3){margin-inline:6%} .funnel div:nth-child(4){margin-inline:9%}
.funnel b{font:400 13px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--clay)}
@media (max-width:620px){.funnel div{grid-template-columns:1fr;margin-inline:0!important}}

.tiers{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.tier{background:var(--surface);border:1px solid var(--line);padding:26px;display:grid;gap:14px;align-content:start;cursor:pointer;text-align:left;color:var(--fg);font:inherit}
.tier[aria-pressed="true"]{border-color:var(--clay);box-shadow:inset 0 3px 0 var(--clay)}
.tier .price{font:200 40px/1 var(--display);letter-spacing:-.03em}
.tier .price small{font-size:14px;color:var(--muted);letter-spacing:0}

.steps{display:grid;gap:0;border-left:1px solid var(--gold);margin-left:6px}
.step{position:relative;padding:0 0 26px 26px;display:grid;gap:4px}
.step::before{content:"";position:absolute;left:-6px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1px solid var(--gold)}
.step.now::before{background:var(--clay);border-color:var(--clay)}
.step .when{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);font-weight:500}

.status{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);background:var(--surface)}
.status div{flex:1 1 120px;padding:14px;border-left:1px solid var(--line);display:grid;gap:2px}
.status div:first-child{border-left:0}
.status b{font:400 12px var(--display);text-transform:uppercase;letter-spacing:.1em}
.status span{font-size:12px;color:var(--muted)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--surface-2);padding:2px 6px;border-radius:4px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink-2);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:13px;z-index:20}
:root[data-theme="dark"] .toast{background:var(--clay);color:#fff}
footer{background:var(--hero-bg);color:rgba(255,255,255,.7);font-size:13px}
footer .wrap{padding-block:40px;display:flex;flex-wrap:wrap;gap:12px 30px;justify-content:space-between}
@media (prefers-reduced-motion:no-preference){.day,.card{transition:border-color .2s}}
</style>
<style>
[hidden]{display:none!important}
.langsw{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:2px;margin-left:auto}
.langsw button{border:0;background:transparent;color:rgba(255,255,255,.75);font:500 11px/1 var(--body);letter-spacing:.14em;padding:7px 11px;border-radius:999px;cursor:pointer}
.langsw button[aria-pressed="true"]{background:var(--sun);color:#1c2733}
.langsw + .right{margin-left:12px}

.hero .wrap{padding-block:56px 170px}
section.block{padding-block:68px;scroll-margin-top:64px}
.credit{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.credit b{color:var(--sun);font-weight:500}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hero-bg);color:var(--hero-fg);border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:60px;position:relative}
.menubtn{display:inline-flex;align-items:center;gap:10px;background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--hero-fg);border-radius:999px;padding:9px 16px;font:500 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
.menubtn:hover{border-color:var(--sun);color:var(--sun)}
.menubtn i{display:grid;gap:3px}.menubtn i::before,.menubtn i::after,.menubtn i span{content:"";display:block;width:14px;height:1px;background:currentColor}
.menu{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:58px;background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.18);min-width:min(340px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow:auto;padding:8px;display:grid}
.menu a{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:10px 12px;color:var(--fg);text-decoration:none;font-size:14px;border-radius:4px}
.menu a span{color:var(--clay);font-size:12px;letter-spacing:.1em;font-variant-numeric:tabular-nums;padding-top:1px}
.menu a:hover,.menu a:focus-visible{background:var(--surface-2)}
.topbar .right{margin-left:auto;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6)}
@media (max-width:560px){.topbar .right{display:none}}
.src{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.src b{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--forest)}
.src a{color:var(--clay);word-break:break-word}
.stat{display:grid;gap:6px}
.stat .num{font-size:38px}
.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:0;border:1px solid var(--line);background:var(--surface)}
.brief a{display:grid;gap:4px;padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.brief a:hover{background:var(--surface-2)}
.brief i{font-style:normal;font-size:12.5px;color:var(--muted)}
.brief b{font-weight:400;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.brief span{font-size:11px;color:var(--clay);letter-spacing:.12em;text-transform:uppercase}
.plat dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:8px 14px;font-size:14.5px}
.plat dt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.plat dd{margin:0;min-width:0}
.plat h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:480px){.plat dl{grid-template-columns:1fr}}
.cost{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--forest)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:0;border:1px solid var(--line);background:var(--surface)}
.flow div{padding:16px;border-right:1px solid var(--line);display:grid;gap:4px;align-content:start}
.flow b{font:400 12.5px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--clay)}
.flow span{font-size:13.5px}
.item .pls{display:flex;gap:3px;flex-wrap:wrap}
.item{grid-template-columns:44px 92px 1fr}
@media (max-width:420px){.item{grid-template-columns:40px 1fr}.item .pls{grid-column:2}.item .ti{grid-column:1/-1}}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl-tr">

<div class="topbar" lang="tr">
  <div class="wrap">
    <button class="menubtn" id="menuBtn" type="button" aria-expanded="false" aria-controls="menu"><i><span></span></i>Menü</button>
    <a class="logo" href="#top">UAE<br>Grand<br>Tour</a>
    <div class="langsw" role="group" aria-label="Dil"><button type="button" data-setlang="en" aria-pressed="false">EN</button><button type="button" data-setlang="tr" aria-pressed="true">TR</button></div>
    <span class="right">Hazırlayan · PMA Partner</span>
    <nav class="menu" id="menu" hidden aria-label="Bölümler">
      <a href="#brief"><span>00</span>Brief ve ekip</a>
      <a href="#kitle"><span>01</span>Pazar ve hedef kitle (kaynaklı)</a>
      <a href="#kpi"><span>02</span>KPI'lar</a>
      <a href="#pazarlama"><span>03</span>Nasıl pazarlarız</a>
      <a href="#uretim"><span>04</span>İçeriği nasıl üretiriz</a>
      <a href="#platform"><span>05</span>Platform platform</a>
      <a href="#linkedin"><span>06</span>LinkedIn planı</a>
      <a href="#kanal"><span>07</span>Kanal kanal · influencer</a>
      <a href="#takvim"><span>08</span>Gün gün içerik planı</a>
      <a href="#yayin"><span>09</span>Yayın planı</a>
      <a href="#paid"><span>10</span>Paid teklif</a>
      <a href="#arnold"><span>11</span>ARNOLD ve haftalık rapor</a>
      <a href="#baslangic"><span>12</span>Başlangıç</a>
    </nav>
  </div>
</div>

<header class="hero" id="top" lang="tr">
  <div class="wrap">
    <p class="eyebrow">UAE Grand Tour · Medya planı · Kasım 2026 – Ocak 2027</p>
    <h1>Bir ülke.<br>Yedi emirlik.<br><span>Üç ay.</span></h1>

<!-- 03 PAZARLAMA -->
<section class="block" id="pazarlama"><div class="wrap">
  <div class="head"><p class="eyebrow">03 · Nasıl pazarlarız</p><h2>Dubai'yi biliyorlar. Diğer altısını biz anlatacağız.</h2></div>
  <div class="grid g3">
    <div class="card"><h3>Ana mesaj</h3><p><b>One Country. Seven Emirates. One Journey.</b> Ziyaretçi Dubai'de ortalama 3,7 gece kalıyor. Biz aynı ülkede 8–12 günlük, planı hazır, tüm emirlikleri kapsayan bir yolculuk sunuyoruz.</p></div>
    <div class="card"><h3>Emirlik emirlik anlatım</h3><p>Her hafta bir emirlik ve sitedeki sloganı: Dubai "Future in motion", Abu Dhabi "Monumental calm", Sharjah "Stories kept alive", Ras Al Khaimah "Above the horizon", Fujairah "Where mountains meet sea".</p></div>
    <div class="card"><h3>Duygu ile satış</h3><p>Site rotaları duyguya göre paketliyor: macera, huzur, aile, kültür, doğa. İçeriklerde "Nasıl hissetmek istersin?" sorusu ana kurgu.</p></div>
    <div class="card"><h3>Güven</h3><p>Dubai ofisi, yerel DMC, 4–5 yıldızlı oteller, özel araç ve rehber. Rehber videoları ve misafir yorumlarıyla görünür kılınır.</p></div>
    <div class="card"><h3>Takvim anları</h3><p>Anma Günü (30 Kas), Ulusal Gün (2 Ara), yılbaşı, F1 Abu Dhabi ve Dubai Shopping Festival (tarihler teyit edilecek), Ocak erken rezervasyon dönemi.</p></div>
    <div class="card"><h3>B2C + B2B birlikte</h3><p>Sosyal medya son kullanıcıda talep yaratır; LinkedIn aynı içerikleri acentelere satış aracı olarak sunar. Küçük ekip için iki kanal, tek içerik havuzu.</p></div>
  </div>
</div></section>

<!-- 04 URETIM -->
<section class="block" id="uretim"><div class="wrap">
  <div class="head"><p class="eyebrow">04 · İçeriği nasıl üretiriz</p><h2>Bir kez üret, beş yerde yayınla.</h2>
  <p class="lede">Küçük ekip için kural: toplu üretim, hazır şablon, çoklu yayın. Haftada 7 içerik üretilir, platformlara uyarlanarak ~25 yayına dönüşür.</p></div>
  <div class="flow" style="margin-bottom:22px">
    <div><b>Pazartesi</b><span>Haftanın planı ARNOLD'da; brief'ler yazılır</span></div>
    <div><b>Salı</b><span>Toplu üretim: 3 video, 2 carousel (Canva + CapCut)</span></div>
    <div><b>Çarşamba</b><span>Metinler, LinkedIn gönderileri, bülten</span></div>
    <div><b>Perşembe</b><span>Müşteri onayı (24–48 saat)</span></div>
    <div><b>Cuma</b><span>Gelecek hafta zamanlanır; rapor verisi toplanır</span></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Görüntü kaynakları</h3><ul>
      <li><b>Müşteri arşivi:</b> sitedeki film, rota fotoğrafları, otel görselleri</li>
      <li><b>Rehberler:</b> telefonla dikey çekim brief'i ("her turda 3 kısa klip")</li>
      <li><b>Partner oteller ve DMC:</b> basın kitleri, izinli görseller</li>
      <li><b>Misafirler (UGC):</b> izinli paylaşımlar, etiketlenen içerikler</li>
      <li><b>Influencer içerikleri:</b> kullanım hakkı alınarak</li>
      <li><b>Son çare:</b> lisanslı stok görüntü</li>
    </ul></div>
    <div class="card"><h3>Formatlar ve tarifler</h3><ul>
      <li><b>Dikey video (7–20 sn):</b> ilk 2 saniyede kanca ("Dubai'den 1 saat uzakta..."), ekranda yazı, sonda net çağrı</li>
      <li><b>Carousel (6–8 kare):</b> kapak, gün gün rota, kime uygun, "Plan your journey"</li>
      <li><b>Story:</b> anket, quiz, soru kutusu, link sticker</li>
      <li><b>LinkedIn doküman:</b> carousel'in PDF hali, acente diliyle</li>
      <li><b>Ton:</b> sitenin sesi; kısa, duyusal, sakin. Dil İngilizce</li>
    </ul></div>
    <div class="card"><h3>Tekrar eden seriler</h3><ul>
      <li><b>Bir Emirlik, Bir Hafta:</b> takvimin omurgası</li>
      <li><b>11 Gün, 60 Saniye:</b> rotayı bir dakikada anlatan video</li>
      <li><b>Choose a Feeling:</b> Story quiz'i ile rota önerisi</li>
      <li><b>Rehberin Köşesi:</b> yerel bilgi, yüz gösteren içerik</li>
      <li><b>Planlama Cuması:</b> vize, hava, ne giyilir</li>
    </ul></div>
    <div class="card"><h3>Bir videonun yolculuğu</h3><p>Pazartesi Reel'i aynı gün Instagram, Facebook, TikTok ve YouTube Shorts'ta yayınlanır. Perşembe LinkedIn'de acente açıklamasıyla tekrar kullanılır. Ayın sonunda bültene girer. En iyi performans gösteren video paid reklama aday olur.</p></div>
  </div>
</div></section>

<section class="block" id="kitle"><div class="wrap">
  <div class="head"><p class="eyebrow">01 · Market and audience</p><h2>What the data says, what we do with it.</h2>
  <p class="lede">Our audience and timing decisions rest on the data below. Under each figure you will find its source and why we use it in this plan.</p></div>
  <div class="grid g3">
    <div class="card stat"><span class="num">18.72M</span><h3>International visitors to Dubai (2024)</h3><p class="small">19.59M in 2025 (+5%). The largest source region is Western Europe, followed by the GCC, South Asia and CIS/Eastern Europe.</p>
      <div class="src"><b>Source</b><span>Dubai Department of Economy and Tourism (DET), via the <a href="https://en.wikipedia.org/wiki/Tourism_in_Dubai" target="_blank" rel="noopener">Tourism in Dubai</a> compilation</span><b>Why</b><span>The market is growing and Western Europe is the biggest source. That is why our primary targets are the UK, Germany, Italy, Switzerland and the Netherlands.</span></div></div>
    <div class="card stat"><span class="num">3.7 nights</span><h3>Average stay in Dubai (2025)</h3><p class="small">Our journeys run 8–12 days.</p>
      <div class="src"><b>Source</b><span><a href="https://en.wikipedia.org/wiki/Tourism_in_Dubai" target="_blank" rel="noopener">Tourism in Dubai</a> (DET data)</span><b>Why</b><span>The average visitor stays briefly. We target long-holiday Europeans and people asking "where next after Dubai?". Message: stay longer, see the other six emirates.</span></div></div>
    <div class="card stat"><span class="num">80.7%</span><h3>Dubai hotel occupancy (2025)</h3><p class="small">Above 84% in December 2025.</p>
      <div class="src"><b>Source</b><span><a href="https://en.wikipedia.org/wiki/Tourism_in_Dubai" target="_blank" rel="noopener">Tourism in Dubai</a> (DET data)</span><b>Why</b><span>December is the busiest month. Organic content builds visibility in December; sales and paid weight shifts to January, when spring trips are booked.</span></div></div>
    <div class="card stat"><span class="num">23.9°C</span><h3>Dubai average high in January</h3><p class="small">41.3°C in August.</p>
      <div class="src"><b>Source</b><span>Dubai Meteorological Office, 1977–2015 normals, <a href="https://en.wikipedia.org/wiki/Climate_of_the_United_Arab_Emirates" target="_blank" rel="noopener">Climate of the UAE</a></span><b>Why</b><span>November–March is the outdoor season, when desert, mountain and coast journeys sell. A November–January plan hits the right window.</span></div></div>
    <div class="card stat"><span class="num">1.37M</span><h3>UK visitors to the UAE (2019)</h3><p class="small">India (2.86M) and Oman (2.81M) rank first and second.</p>
      <div class="src"><b>Source</b><span>Arrivals by nationality table, <a href="https://en.wikipedia.org/wiki/Tourism_in_the_United_Arab_Emirates" target="_blank" rel="noopener">Tourism in the UAE</a></span><b>Why</b><span>The UK is the largest European market, so it is a primary target. India and the GCC are large but short-stay; we address them as secondary targets with family and short journeys.</span></div></div>
    <div class="card stat"><span class="num">12%</span><h3>Tourism's share of the UAE economy (2023)</h3><p class="small">About AED 220 billion and 809,000 jobs. Target: 30.9M tourists by 2030.</p>
      <div class="src"><b>Source</b><span>UAE Ministry of Economy (May 2024), <a href="https://en.wikipedia.org/wiki/Tourism_in_the_United_Arab_Emirates" target="_blank" rel="noopener">Tourism in the UAE</a></span><b>Why</b><span>The government backs tourism; official campaigns (National Day, festivals) give our content free visibility.</span></div></div>
  </div>

  <div class="tbl" style="margin-top:22px"><table>
    <thead><tr><th>Platform (UAE)</th><th class="r">Ad reach</th><th>What it means for us</th></tr></thead>

      <tr><td><span class="pl TT">TT</span> TikTok</td><td class="r">11.3M (18+)</td><td>Discovery channel; the same videos reach a large audience at low cost</td></tr>
      <tr><td><span class="pl FB">FB</span> Facebook</td><td class="r">9.7M</td><td>40+ and European audiences; managed together with Instagram</td></tr>
      <tr><td><span class="pl LI">LI</span> LinkedIn</td><td class="r">9.4M members</td><td>Dense agency and DMC network in the UAE; main B2B channel</td></tr>
      <tr><td><span class="pl YT">YT</span> YouTube</td><td class="r">8.25M</td><td>Research and long-form video; reused as Shorts</td></tr>
      <tr><td><span class="pl IG">IG</span> Instagram</td><td class="r">7.6M</td><td>The travel shop window; main organic channel</td></tr>
    </tbody>

<section class="block" id="pazarlama"><div class="wrap">
  <div class="head"><p class="eyebrow">03 · How we market the region</p><h2>They know Dubai. We will tell them about the other six.</h2></div>
  <div class="grid g3">
    <div class="card"><h3>Core message</h3><p><b>One Country. Seven Emirates. One Journey.</b> Visitors stay 3.7 nights in Dubai on average. We offer an 8–12 day, fully planned journey across every emirate in the same country.</p></div>
    <div class="card"><h3>Emirate by emirate</h3><p>One emirate a week, with its tagline from the site: Dubai "Future in motion", Abu Dhabi "Monumental calm", Sharjah "Stories kept alive", Ras Al Khaimah "Above the horizon", Fujairah "Where mountains meet sea".</p></div>
    <div class="card"><h3>Sell a feeling</h3><p>The site packages journeys by feeling: adventure, calm, family, culture, nature. "How do you want to feel?" is the central idea of our content.</p></div>
    <div class="card"><h3>Trust</h3><p>Dubai office, local DMC, 4–5 star hotels, private vehicle and guide. Made visible through guide videos and guest reviews.</p></div>
    <div class="card"><h3>Calendar moments</h3><p>Commemoration Day (30 Nov), National Day (2 Dec), New Year, F1 Abu Dhabi and Dubai Shopping Festival (dates to be confirmed), January early-booking season.</p></div>
    <div class="card"><h3>B2C and B2B together</h3><p>Social media creates demand with travellers; LinkedIn offers the same content to agents as a sales tool. Two channels, one content pool, which suits a small team.</p></div>
  </div>
</div></section>

<section class="block" id="uretim"><div class="wrap">
  <div class="head"><p class="eyebrow">04 · How we produce content</p><h2>Produce once, publish in five places.</h2>
  <p class="lede">The rule for a small team: batch production, ready-made templates, multi-platform publishing. Seven pieces a week become about 25 posts.</p></div>
  <div class="flow" style="margin-bottom:22px">
    <div><b>Monday</b><span>Week plan in ARNOLD; briefs written</span></div>
    <div><b>Tuesday</b><span>Batch production: 3 videos, 2 carousels (Canva + CapCut)</span></div>
    <div><b>Wednesday</b><span>Copy, LinkedIn posts, newsletter</span></div>
    <div><b>Thursday</b><span>Client approval (24–48 hours)</span></div>
    <div><b>Friday</b><span>Next week scheduled; report data collected</span></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Footage sources</h3><ul>
      <li><b>Client archive:</b> the website film, journey photos, hotel images</li>
      <li><b>Guides:</b> vertical phone clips brief ("3 short clips per tour")</li>
      <li><b>Partner hotels and DMC:</b> press kits, licensed images</li>
      <li><b>Guests (UGC):</b> shared with permission, tagged content</li>
      <li><b>Influencer content:</b> with usage rights</li>
      <li><b>Last resort:</b> licensed stock footage</li>
    </ul></div>
    <div class="card"><h3>Formats and recipes</h3><ul>
      <li><b>Vertical video (7–20 s):</b> hook in the first 2 seconds ("1 hour from Dubai..."), on-screen text, clear call to action</li>
      <li><b>Carousel (6–8 slides):</b> cover, journey day by day, who it suits, "Plan your journey"</li>
      <li><b>Stories:</b> polls, quizzes, question box, link sticker</li>
      <li><b>LinkedIn document:</b> the carousel as a PDF, in trade language</li>
      <li><b>Tone:</b> the website's voice; short, sensory, calm. Language: English</li>
    </ul></div>
    <div class="card"><h3>Recurring series</h3><ul>
      <li><b>One Emirate, One Week:</b> the backbone of the calendar</li>
      <li><b>11 Days, 60 Seconds:</b> a journey told in one minute</li>
      <li><b>Choose a Feeling:</b> Story quiz with a journey suggestion</li>
      <li><b>Guide's Corner:</b> local knowledge, face-to-camera content</li>
      <li><b>Planning Friday:</b> visas, weather, what to wear</li>
    </ul></div>
    <div class="card"><h3>The life of one video</h3><p>Monday's Reel goes out the same day on Instagram, Facebook, TikTok and YouTube Shorts. On Thursday it is reused on LinkedIn with an agent-facing caption. At month end it goes into the newsletter. The best performer becomes a paid ad candidate.</p></div>
  </div>
</div></section>

<section class="block" id="linkedin"><div class="wrap">
  <div class="head"><p class="eyebrow">06 · LinkedIn plan</p><h2>One agent, hundreds of guests.</h2>
  <p class="lede">The most efficient sales channel for a small team. The UAE has 9.4 million LinkedIn members and a dense tourism network. The goal is to position our journeys as ready-to-sell products for agents.</p></div>
  <div class="grid g2">
    <div class="card"><h3>Two accounts working together</h3><ul>
      <li><b>Company page:</b> journeys, season updates, corporate trust. 2 posts a week</li>
      <li><b>Founder's or sales manager's personal profile:</b> personal profiles get far more reach than company pages. 2 posts a week, ideally one personal experience</li>
    </ul></div>
    <div class="card"><h3>A 30-minute daily routine</h3><ul>
      <li>10 connection requests: agency owners, product managers and MICE planners in target markets</li>
      <li>Comment on 5 industry posts</li>
      <li>Short intro message to those who accept (not a pitch; offer the journey PDF)</li>
      <li>Every contact logged in ARNOLD as a B2B lead</li>
    </ul></div>
    <div class="card"><h3>Content ideas</h3><ul>
      <li>Journey PDFs as document posts: "Grand Classic: 11 days, 7 emirates"</li>
      <li>"Where can your clients go after Dubai?" series</li>
      <li>Behind the operation: transfers, guides, hotel selection</li>
      <li>Season availability and group capacity</li>
      <li>Guest and agent testimonials</li>
      <li>Monthly LinkedIn newsletter: "Seven Emirates Brief"</li>
    </ul></div>
    <div class="card"><h3>One event in January</h3><p>A 30-minute online session for agents: <b>"Selling the UAE beyond Dubai"</b>. Announced as a LinkedIn Event; attendees receive net rates and journey PDFs.</p><p class="small">If budget is approved: Sales Navigator for sharper agent search, and targeted LinkedIn ads.</p></div>
  </div>
</div></section>

<script>
(function(){

function show(lang){
  var tpl=document.getElementById('tpl-'+lang)||document.getElementById('tpl-en');
  var frag=document.importNode(tpl.content,true);
  var codes=[];frag.querySelectorAll('script').forEach(function(s){codes.push(s.textContent);s.remove();});
  var y=window.scrollY;root.innerHTML='';root.appendChild(frag);
  codes.forEach(function(c){var s=document.createElement('script');s.textContent=c;root.appendChild(s);});
  document.documentElement.lang=lang;
  try{localStorage.setItem('ugt-lang2',lang)}catch(e){}
  window.scrollTo(0,y);
}
document.addEventListener('click',function(e){var b=e.target.closest('[data-setlang]');if(b){show(b.getAttribute('data-setlang'));}});
var l='en';try{l=localStorage.getItem('ugt-lang2')||'en'}catch(e){}
show(l);
})();
</script>
